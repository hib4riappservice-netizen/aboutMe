<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HIB4RI | アプリ開発サービス</title>
    <meta name="description" content="HIB4RIが開発しているアプリ・サービスをまとめたポータルページです。" />
    <style>
      /* Inlined so it applies before any external stylesheet finishes
         loading -- otherwise the splash logo briefly renders at its native
         512px size and visibly shrinks once style.css catches up. */
      .splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f6f6f4;
        transition: opacity 0.4s ease;
      }
      .splash-logo {
        width: 42vw;
        max-width: 220px;
        min-width: 120px;
        aspect-ratio: 1 / 1;
        height: auto;
        border-radius: 16px;
      }
      .splash-hide {
        opacity: 0;
        pointer-events: none;
      }
    </style>
    <link rel="icon" type="image/png" sizes="48x48" href="assets/icons/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="theme-color" content="#f6f6f4" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="splash" class="splash">
      <img
        src="assets/icons/icon-512.png"
        width="512"
        height="512"
        alt="HIB4RI"
        class="splash-logo"
      />
    </div>

    <header class="hero">
      <div class="hero-bg"></div>
      <div class="social-links" id="social-links"></div>
      <div class="hero-content">
        <div class="avatar-wrap">
          <img id="avatar-img" src="" alt="" />
        </div>
        <div class="hero-text">
          <p class="tagline" id="tagline"></p>
          <h1 class="brand-name" id="brand-name">HIB4RI</h1>
        </div>
      </div>
      <div class="hero-bar">
        <p class="bio" id="bio"></p>
        <p class="copyright">&copy; <span id="year"></span> HIB4RI</p>
      </div>
    </header>

    <main>
      <section class="sites">
        <div class="sites-heading">
          <h2>開発サイト一覧</h2>
          <span id="site-count"></span>
        </div>
        <div class="site-grid" id="site-grid"></div>
      </section>
    </main>

    <script src="data.js"></script>
    <script src="script.js"></script>
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();

      // Timed from navigation start, not window "load" -- waiting for every
      // image/font to finish would make the hold time vary with network
      // speed (near-instant when cached, skipped entirely when slow).
      setTimeout(() => {
        document.getElementById("splash").classList.add("splash-hide");
      }, Math.max(0, 1000 - performance.now()));
    </script>
  </body>
</html>
